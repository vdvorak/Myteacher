[project]
name = "myteacher"
version = "0.1.0"
description = "Myteacher backend: API, lesson schema and deterministic assessment"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
